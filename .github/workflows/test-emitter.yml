name: test-emitter

on:
  pull_request:
    branches:
      - main
jobs:
   test-emitter:
     runs-on: windows-latest
     steps:
       - name: Checkout
         uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
       - name: Install Node.js 20
         uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
         with:
           node-version: 20.x
       - name: Install typespec & rush
         run: |
           npm install -g "@typespec/compiler"
           npm install -g @microsoft/rush@5.63.1
       - name: Rush sync-versions
         run: |
           rush sync-versions
       - name: Rush Update
         run: |
           rush update
       - name: Rush Rebuild
         run: |
           rush rebuild
       - name: Verify Typespec emitter
         shell: pwsh
         working-directory: tests-upgrade/tests-emitter
         run: |
           ./EmitterTest.ps1 -AllowList -SaveResult
       - name: Save artifacts
         if: always()
         uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
         with:
           name: CompareResult
           path: tests-upgrade/tests-emitter/CompareResult
           if-no-files-found: warn
           retention-days: 7 
