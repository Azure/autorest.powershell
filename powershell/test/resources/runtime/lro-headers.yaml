swagger: "2.0"
info:
  title: LroHeaders
  version: "2026-01-01"
host: management.azure.com
schemes:
  - https
produces:
  - application/json
consumes:
  - application/json
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.Test/widgets/{name}:
    parameters:
      - name: subscriptionId
        in: path
        required: true
        type: string
      - name: name
        in: path
        required: true
        type: string
      - name: api-version
        in: query
        required: true
        type: string
    put:
      operationId: Widgets_Create
      description: Creates a widget with asynchronous polling and a final GET.
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: original-uri
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Widget"
      responses:
        "200":
          description: Completed.
          schema:
            $ref: "#/definitions/Widget"
        "201":
          description: Created.
          schema:
            $ref: "#/definitions/Widget"
        "202":
          description: Accepted.
          schema:
            $ref: "#/definitions/Widget"
    get:
      operationId: Widgets_Get
      description: Gets a widget without LRO polling.
      responses:
        "200":
          description: Completed.
          schema:
            $ref: "#/definitions/Widget"
definitions:
  Widget:
    type: object
    properties:
      id:
        type: string
        readOnly: true
      name:
        type: string
        readOnly: true
      location:
        type: string
      properties:
        type: object
        properties:
          provisioningState:
            type: string
            readOnly: true
